<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理系统</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Axios -->
  <script src="https://unpkg.com/axios@1.6.0/dist/axios.min.js"></script>
  
  <!-- Tabulator -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css">
  <script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
  
  <!-- Font Awesome (图标) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 自定义样式 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    
    /* 错误字段高亮 */
    .error-field {
      border-color: #ef4444 !important;
      background-color: #fef2f2;
    }
    
    .error-message {
      color: #ef4444;
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }
    
    /* 按钮禁用状态 */
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* 表格行悬停效果 */
    .tabulator-row:hover {
      background-color: #f3f4f6 !important;
    }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen">
    <!-- 应用会动态渲染到这里 -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <div class="text-gray-700">正在加载...</div>
      </div>
    </div>
  </div>

  <!-- 配置文件（必须第一个加载） -->
  <script src="js/config.js"></script>
  
  <!-- 工具函数 -->
  <script src="js/utils/formatter.js"></script>
  <script src="js/utils/validator.js"></script>
  
  <!-- 核心模块 -->
  <script src="js/calculator.js"></script>
  <script src="js/api.js"></script>
  
  <!-- 组件 -->
  <script src="js/components/OrderList.js"></script>
  <script src="js/components/OrderForm.js"></script>
  <script src="js/components/OrderDetail.js"></script>
  <script src="js/components/ConfigPanel.js"></script>
  
  <!-- 主应用 -->
  <script src="js/app.js"></script>
</body>
</html>
